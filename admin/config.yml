backend:
  name: git-gateway
  branch: main

local_backend: true

media_folder: "assets/uploads"
public_folder: "/assets/uploads"

collections:
  - name: "dashboard"
    label: "Dashboard"
    files:
      - label: "Indicadores del Dashboard"
        name: "indicadores"
        file: "data/indicadores.json"
        format: "json"
        fields:
          - label: "Avance Global (%)"
            name: "avance_global"
            widget: "number"
            value_type: "float"
            min: 0
            max: 100
            default: 0

          - label: "Total de Participantes"
            name: "total_participantes"
            widget: "number"
            value_type: "int"
            min: 0
            default: 0

          - label: "Países Impactados"
            name: "paises_impactados"
            widget: "number"
            value_type: "int"
            min: 0
            default: 0

          - label: "Capacitaciones Realizadas"
            name: "capacitaciones_realizadas"
            widget: "number"
            value_type: "int"
            min: 0
            default: 0

          - label: "Distribución por Género"
            name: "distribucion_genero"
            widget: "object"
            fields:
              - label: "Hombres"
                name: "hombres"
                widget: "number"
                value_type: "int"
                min: 0
                default: 0

              - label: "Mujeres"
                name: "mujeres"
                widget: "number"
                value_type: "int"
                min: 0
                default: 0

          - label: "Roles de Participantes"
            name: "roles_participantes"
            widget: "object"
            fields:
              - label: "Docentes"
                name: "docentes"
                widget: "number"
                value_type: "int"
                min: 0
                default: 0

              - label: "Investigadores"
                name: "investigadores"
                widget: "number"
                value_type: "int"
                min: 0
                default: 0

              - label: "Estudiantes"
                name: "estudiantes"
                widget: "number"
                value_type: "int"
                min: 0
                default: 0

              - label: "Aliados Externos"
                name: "aliados_externos"
                widget: "number"
                value_type: "int"
                min: 0
                default: 0

          - label: "Comunidades Impactadas"
            name: "comunidades_impactadas"
            widget: "object"
            fields:
              - label: "Comunidades Indígenas"
                name: "indigenas"
                widget: "number"
                value_type: "int"
                min: 0
                default: 0

              - label: "Comunidades Rurales"
                name: "rurales"
                widget: "number"
                value_type: "int"
                min: 0
                default: 0

  - name: "traducciones"
    label: "Gestión de Idiomas (i18n)"
